# Provisionamento automático do datasource Loki no Grafana.
#
# Sem isso, seria preciso cadastrar o Loki manualmente pela interface a cada
# vez que o volume de dados do Grafana for recriado. Com este arquivo, o
# datasource já aparece pronto no primeiro boot.
apiVersion: 1

datasources:
  - name: Loki
    type: loki
    access: proxy
    url: http://loki:3100
    isDefault: true
    editable: false
