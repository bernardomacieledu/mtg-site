server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Assets com hash podem ser cacheados agressivamente
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # DNS interno do Docker: permite resolver "api" em runtime.
    # Com o nome fixo no proxy_pass, o nginx tenta resolver ao ler a config e
    # aborta o boot se a API ainda não subiu.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # API -> container Django
    location /api/ {
        set $api_upstream http://api:8000;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # SPA history mode: qualquer rota cai no index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
