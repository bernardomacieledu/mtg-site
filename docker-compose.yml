services:
  api:
    build:
      context: ./api
    container_name: mtg-api
    restart: unless-stopped
    environment:
      DJANGO_DEBUG: ${DJANGO_DEBUG:-1}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-dev-secret-change-me}
      JWT_SECRET: ${JWT_SECRET:-dev-jwt-secret-change-me}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-*}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:8080,http://localhost:5173}
      # host.docker.internal aponta para o host via a entrada extra_hosts
      # abaixo; é o MariaDB já instalado na máquina, não um container.
      DB_HOST: ${DB_HOST:-host.docker.internal}
      DB_PORT: ${DB_PORT:-3306}
      DB_NAME: ${DB_NAME:-mtg_db}
      DB_USER: ${DB_USER:-mtg_ingest}
      DB_PASSWORD: ${DB_PASSWORD:-mtgpass}
      # Se 1, popula o banco com as coleções mais recentes no primeiro boot
      SEED_ON_START: ${SEED_ON_START:-1}
      SEED_RECENT_SETS: ${SEED_RECENT_SETS:-8}
    volumes:
      - scryfall_cache:/app/cache
    extra_hosts:
      # Faz host.docker.internal funcionar também no Linux (no Docker Desktop
      # do Windows/Mac já funciona nativamente; esta linha é o que falta lá).
      - "host.docker.internal:host-gateway"
    ports:
      - "${API_PORT:-8000}:8000"

  worker:
    build:
      context: ./api
    container_name: mtg-worker
    restart: unless-stopped
    command: ["python", "manage.py", "run_scheduler", "--interval", "${SCHEDULER_INTERVAL:-60}"]
    environment:
      DJANGO_DEBUG: ${DJANGO_DEBUG:-1}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-dev-secret-change-me}
      JWT_SECRET: ${JWT_SECRET:-dev-jwt-secret-change-me}
      DB_HOST: ${DB_HOST:-host.docker.internal}
      DB_PORT: ${DB_PORT:-3306}
      DB_NAME: ${DB_NAME:-mtg_db}
      DB_USER: ${DB_USER:-mtg_ingest}
      DB_PASSWORD: ${DB_PASSWORD:-mtgpass}
      SEED_ON_START: 0
      SEED_PRICES: 0
    volumes:
      - scryfall_cache:/app/cache
    extra_hosts:
      - "host.docker.internal:host-gateway"

  adminer:
    image: adminer:latest
    container_name: mtg-adminer
    restart: unless-stopped
    environment:
      # Pré-preenche o campo "Servidor" do Adminer com o host correto
      ADMINER_DEFAULT_SERVER: ${DB_HOST:-host.docker.internal}
      ADMINER_DESIGN: ${ADMINER_DESIGN:-dracula}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${ADMINER_PORT:-8081}:8080"

  front:
    build:
      context: ./front
      args:
        # vazio => o front usa /api do mesmo host (proxy do nginx)
        VITE_API_URL: ${VITE_API_URL:-}
    container_name: mtg-front
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${FRONT_PORT:-8080}:80"

  # ── Logs (Loki + Alloy + Grafana) ────────────────────────────────────────
  # Ferramenta separada do MTG Nexus, com login próprio (o do Grafana).
  # Loki guarda o histórico; Alloy coleta os logs dos containers deste
  # projeto; Grafana é a interface web de busca.

  loki:
    image: grafana/loki:3.3.0
    container_name: mtg-loki
    restart: unless-stopped
    # Usa o local-config.yaml que já vem na imagem — evita depender de um
    # schema de configuração próprio, que muda entre versões do Loki.
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - loki_data:/loki
    # Sem publicar porta no host: só Alloy e Grafana precisam falar com ele,
    # e ambos estão na mesma rede interna do compose.

  alloy:
    image: grafana/alloy:latest
    container_name: mtg-alloy
    restart: unless-stopped
    command:
      - run
      - /etc/alloy/config.alloy
      - --server.http.listen-addr=0.0.0.0:12345
    volumes:
      - ./logging/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      # Interface própria do Alloy, útil para ver o estado do pipeline de
      # coleta (Components) enquanto se depura a configuração.
      - "${ALLOY_PORT:-12345}:12345"
    depends_on:
      - loki

  grafana:
    image: grafana/grafana:latest
    container_name: mtg-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-changeme}
      # Evita a tela de "crie um novo usuário" pedindo para trocar a senha
      # padrão a cada login — quem administra troca pelo próprio Grafana
      # quando quiser.
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./logging/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "${GRAFANA_PORT:-3001}:3000"
    depends_on:
      - loki

volumes:
  scryfall_cache:
  loki_data:
  grafana_data:
