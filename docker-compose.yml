services:
  api:
    build:
      context: ./api
    container_name: mtg-api
    restart: unless-stopped
    environment:
      DJANGO_DEBUG: ${DJANGO_DEBUG:-1}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-dev-secret-change-me}
      JWT_SECRET: ${JWT_SECRET:-dev-jwt-secret-change-me}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-*}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:8080,http://localhost:5173}
      # host.docker.internal aponta para o host via a entrada extra_hosts
      # abaixo; é o MariaDB já instalado na máquina, não um container.
      DB_HOST: ${DB_HOST:-host.docker.internal}
      DB_PORT: ${DB_PORT:-3306}
      DB_NAME: ${DB_NAME:-mtg_db}
      DB_USER: ${DB_USER:-mtg_ingest}
      DB_PASSWORD: ${DB_PASSWORD:-mtgpass}
      # Se 1, popula o banco com as coleções mais recentes no primeiro boot
      SEED_ON_START: ${SEED_ON_START:-1}
      SEED_RECENT_SETS: ${SEED_RECENT_SETS:-8}
    volumes:
      - scryfall_cache:/app/cache
    extra_hosts:
      # Faz host.docker.internal funcionar também no Linux (no Docker Desktop
      # do Windows/Mac já funciona nativamente; esta linha é o que falta lá).
      - "host.docker.internal:host-gateway"
    ports:
      - "${API_PORT:-8000}:8000"

  worker:
    build:
      context: ./api
    container_name: mtg-worker
    restart: unless-stopped
    command: ["python", "manage.py", "run_scheduler", "--interval", "${SCHEDULER_INTERVAL:-60}"]
    environment:
      DJANGO_DEBUG: ${DJANGO_DEBUG:-1}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-dev-secret-change-me}
      JWT_SECRET: ${JWT_SECRET:-dev-jwt-secret-change-me}
      DB_HOST: ${DB_HOST:-host.docker.internal}
      DB_PORT: ${DB_PORT:-3306}
      DB_NAME: ${DB_NAME:-mtg_db}
      DB_USER: ${DB_USER:-mtg_ingest}
      DB_PASSWORD: ${DB_PASSWORD:-mtgpass}
      SEED_ON_START: 0
      SEED_PRICES: 0
    volumes:
      - scryfall_cache:/app/cache
    extra_hosts:
      - "host.docker.internal:host-gateway"

  adminer:
    image: adminer:latest
    container_name: mtg-adminer
    restart: unless-stopped
    environment:
      # Pré-preenche o campo "Servidor" do Adminer com o host correto
      ADMINER_DEFAULT_SERVER: ${DB_HOST:-host.docker.internal}
      ADMINER_DESIGN: ${ADMINER_DESIGN:-dracula}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${ADMINER_PORT:-8081}:8080"

  front:
    build:
      context: ./front
      args:
        # vazio => o front usa /api do mesmo host (proxy do nginx)
        VITE_API_URL: ${VITE_API_URL:-}
    container_name: mtg-front
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${FRONT_PORT:-8080}:80"

volumes:
  scryfall_cache:
